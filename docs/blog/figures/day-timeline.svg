<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">A working day in faces</title><desc id="d">An example working day: 00:00 NIGHT (until 07:00: heavy eyes, the screen dimmed); 08:30 YESTERDAY (first unlock of the day: yesterday&#x27;s hours, tasks and pull requests, 15 s); then GOOD MORNING (then today&#x27;s page: next meeting, hours, reviews, Claude&#x27;s limits, 20 s); 08:31 LOG MONDAY&#x27;S HOURS (Monday has under 4 hours logged: a tear runs until I log them); 09:10 LOCKED IN (a task of mine is in development); 10:55 MEETING IN 5 MIN (counting down, taking turns with the meeting&#x27;s name); 11:00 ON AIR (IN A MEETING m:ss, while something records from the microphone); 11:45 LOCKED IN (back to work); 12:30 LUNCH BREAK (the laptop is locked between 12:00 and 14:00); 13:15 LOCKED IN; 14:00 FOCUS 0:00 (laid flat: the timer counts up, notifications go quiet); 15:30 FOCUSED 1:30:00 (stood up: 15 s of pride, then fireworks (25 minutes or more)); 17:40 DAY DONE (locked after 17:00: the day&#x27;s recap for 30 s, then AWAY); 18:10 BUDDY (away for 30 minutes: the Buddy logo bounces like an idle DVD logo); 23:00 NIGHT</desc><rect x="0.5" y="0.5" width="899" height="939" rx="14" fill="#FBF9FA" stroke="#E6DDE3"/><text x="40.0" y="54.0" font-size="27" font-weight="700" fill="#241A22" text-anchor="start">A working day in faces</text>
<text x="40.0" y="84.0" font-size="16" font-weight="400" fill="#55464F" text-anchor="start">An example Tuesday. The times are made up; the rules are the firmware’s.</text>
<text x="100.0" y="156.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">00:00</text>
<rect x="150.0" y="134.0" width="68.1" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="155.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">NIGHT</text>
<text x="352.0" y="155.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">until 07:00: heavy eyes, the screen dimmed</text>
<text x="100.0" y="208.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">08:30</text>
<rect x="150.0" y="186.0" width="101.8" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="207.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">YESTERDAY</text>
<text x="352.0" y="207.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">first unlock of the day: yesterday&#x27;s hours, tasks and pull requests, 15 s</text>
<rect x="150.0" y="238.0" width="127.1" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="259.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GOOD MORNING</text>
<text x="352.0" y="259.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">then today&#x27;s page: next meeting, hours, reviews, Claude&#x27;s limits, 20 s</text>
<text x="100.0" y="312.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">08:31</text>
<rect x="150.0" y="290.0" width="177.6" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="311.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">LOG MONDAY&#x27;S HOURS</text>
<text x="352.0" y="311.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">Monday has under 4 hours logged: a tear runs until I log them</text>
<text x="100.0" y="364.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">09:10</text>
<rect x="150.0" y="342.0" width="101.8" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="363.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">LOCKED IN</text>
<text x="352.0" y="363.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">a task of mine is in development</text>
<text x="100.0" y="416.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">10:55</text>
<rect x="150.0" y="394.0" width="160.8" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="415.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">MEETING IN 5 MIN</text>
<text x="352.0" y="415.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">counting down, taking turns with the meeting&#x27;s name</text>
<text x="100.0" y="468.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">11:00</text>
<rect x="150.0" y="446.0" width="76.5" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="467.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">ON AIR</text>
<text x="352.0" y="467.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">IN A MEETING m:ss, while something records from the microphone</text>
<text x="100.0" y="520.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">11:45</text>
<rect x="150.0" y="498.0" width="101.8" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="519.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">LOCKED IN</text>
<text x="352.0" y="519.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">back to work</text>
<text x="100.0" y="572.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">12:30</text>
<rect x="150.0" y="550.0" width="118.6" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="571.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">LUNCH BREAK</text>
<text x="352.0" y="571.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">the laptop is locked between 12:00 and 14:00</text>
<text x="100.0" y="624.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">13:15</text>
<rect x="150.0" y="602.0" width="101.8" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="623.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">LOCKED IN</text>
<text x="100.0" y="676.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">14:00</text>
<rect x="150.0" y="654.0" width="110.2" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="675.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">FOCUS 0:00</text>
<text x="352.0" y="675.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">laid flat: the timer counts up, notifications go quiet</text>
<text x="100.0" y="728.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">15:30</text>
<rect x="150.0" y="706.0" width="152.3" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="727.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">FOCUSED 1:30:00</text>
<text x="352.0" y="727.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">stood up: 15 s of pride, then fireworks (25 minutes or more)</text>
<text x="100.0" y="780.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">17:40</text>
<rect x="150.0" y="758.0" width="93.4" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="779.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">DAY DONE</text>
<text x="352.0" y="779.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">locked after 17:00: the day&#x27;s recap for 30 s, then AWAY</text>
<text x="100.0" y="832.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">18:10</text>
<rect x="150.0" y="810.0" width="68.1" height="32.0" rx="8" fill="#1C171E"/>
<text x="163.0" y="831.0" font-size="14" font-weight="700" fill="#F7F3F7" text-anchor="start" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">BUDDY</text>
<text x="352.0" y="831.0" font-size="15" font-weight="400" fill="#55464F" text-anchor="start">away for 30 minutes: the Buddy logo bounces like an idle DVD logo</text>
<text x="100.0" y="884.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="end">23:00</text>
