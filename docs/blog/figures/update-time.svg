<svg xmlns="http://www.w3.org/2000/svg" width="900" height="484" viewBox="0 0 900 484" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Installing a new firmware</title><desc id="d">Installing a 1.9 MB firmware: about 23 to 25 s over USB, about 90 s over Wi-Fi in 1 KB pieces. Resume test: the transfer was cut at 63 % and the same command went on at 65 % and finished.</desc><rect x="0.5" y="0.5" width="899" height="483" rx="14" fill="#FBF9FA" stroke="#E6DDE3"/><text x="40.0" y="54.0" font-size="27" font-weight="700" fill="#241A22" text-anchor="start">Installing a new firmware</text>
<text x="40.0" y="84.0" font-size="16" font-weight="400" fill="#55464F" text-anchor="start">A 1.9 MB image, over the cable and over the air</text>
<text x="40.0" y="140.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="start">Time to install</text>
<line x1="300.0" y1="156.0" x2="300.0" y2="232.0" stroke="#CFC4CC" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="252.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">0 s</text>
<line x1="425.0" y1="156.0" x2="425.0" y2="232.0" stroke="#ECE5EA" stroke-width="1" stroke-linecap="round"/>
<text x="425.0" y="252.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">25 s</text>
<line x1="550.0" y1="156.0" x2="550.0" y2="232.0" stroke="#ECE5EA" stroke-width="1" stroke-linecap="round"/>
<text x="550.0" y="252.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">50 s</text>
<line x1="675.0" y1="156.0" x2="675.0" y2="232.0" stroke="#ECE5EA" stroke-width="1" stroke-linecap="round"/>
<text x="675.0" y="252.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">75 s</text>
<line x1="800.0" y1="156.0" x2="800.0" y2="232.0" stroke="#ECE5EA" stroke-width="1" stroke-linecap="round"/>
<text x="800.0" y="252.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">100 s</text>
<text x="286.0" y="180.0" font-size="15" font-weight="400" fill="#241A22" text-anchor="end">USB cable</text>
<path d="M300.0,165.0 H415.0 Q415.0,165.0 415.0,165.0 V185.0 Q415.0,185.0 415.0,185.0 H300.0 Z" fill="#7A3A6C"><title>USB cable: 23–25 s</title></path>
<path d="M417.0,165.0 H421.0 Q425.0,165.0 425.0,169.0 V181.0 Q425.0,185.0 421.0,185.0 H417.0 Z" fill="#CDB3C5"><title>USB cable: 23–25 s</title></path>
<text x="433.0" y="180.0" font-size="15" font-weight="600" fill="#241A22" text-anchor="start">23–25 s</text>
<text x="286.0" y="218.0" font-size="15" font-weight="400" fill="#241A22" text-anchor="end">Wi-Fi, signed, 1 KB pieces</text>
<path d="M300.0,203.0 H746.0 Q750.0,203.0 750.0,207.0 V219.0 Q750.0,223.0 746.0,223.0 H300.0 Z" fill="#7A3A6C"><title>Wi-Fi, signed, 1 KB pieces: about 90 s</title></path>
<text x="758.0" y="218.0" font-size="15" font-weight="600" fill="#241A22" text-anchor="start">about 90 s</text>
<text x="40.0" y="306.0" font-size="16" font-weight="700" fill="#241A22" text-anchor="start">A broken-off update goes on where it stopped</text>
<text x="286.0" y="351.0" font-size="15" font-weight="400" fill="#241A22" text-anchor="end">First run</text>
<path d="M300.0,336.0 H611.0 Q615.0,336.0 615.0,340.0 V352.0 Q615.0,356.0 611.0,356.0 H300.0 Z" fill="#7A3A6C"><title>first run: 0 to 63 %</title></path>
<text x="623.0" y="351.0" font-size="15" font-weight="600" fill="#241A22" text-anchor="start">Wi-Fi cut at 63 %</text>
<text x="286.0" y="389.0" font-size="15" font-weight="400" fill="#241A22" text-anchor="end">Same command again</text>
<rect x="300.0" y="374.0" width="323.0" height="20.0" rx="4" fill="#E0D8DE"/>
<path d="M625.0,374.0 H796.0 Q800.0,374.0 800.0,378.0 V390.0 Q800.0,394.0 796.0,394.0 H625.0 Z" fill="#7A3A6C"><title>second run: 65 to 100 %</title></path>
<text x="615.0" y="389.0" font-size="14" font-weight="600" fill="#241A22" text-anchor="end">kept from the first run · goes on at 65 %</text>
<text x="800.0" y="418.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">100 %</text>
<text x="300.0" y="418.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="middle">0 %</text>
<text x="40.0" y="462.0" font-size="13" font-weight="400" fill="#6F6069" text-anchor="start">Measured on the real board, 18–19 November 2026. The buddy keeps a broken-off update for 10 minutes.</text></svg>
