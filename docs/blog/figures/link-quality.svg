<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">The Wi-Fi link, on the desk and in a weak spot</title><desc id="d">Wi-Fi link, 40 sealed pings per test. Pings lost: on the desk 0 of 40; weak spot on a charger 8 of 40; same spot, one run 13 of 20. Round trip: desk median 4 to 60 ms; weak spot median 187 ms, slowest 762 ms. Firmware updates in the weak spot broke off at 67 to 135 KB of 1.9 MB.</desc><rect x="0.5" y="0.5" width="899" height="699" rx="14" fill="#FBF9FA" stroke="#E6DDE3"/><text x="40.0" y="54.0" font-size="27" font-weight="700" fill="#241A22" text-anchor="start">The Wi-Fi link, on the desk and in a weak spot</text>
