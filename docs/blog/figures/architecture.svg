<text x="460.0" y="604.0" font-size="15" font-weight="700" fill="#241A22" text-anchor="start">Wi-Fi, UDP: every packet sealed with AES-256-GCM</text>
<text x="460.0" y="624.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">the buddy only answers; it never calls the laptop</text>
<text x="460.0" y="644.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">buddy-say, signed updates and animations use it too</text>
<text x="362.0" y="624.0" font-size="14" font-weight="600" fill="#55464F" text-anchor="end">USB: fallback, settings, rescue</text>
