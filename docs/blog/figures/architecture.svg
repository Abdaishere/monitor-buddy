<rect x="52.0" y="280.0" width="272.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#E6DDE3" stroke-width="1"/>
<text x="68.0" y="307.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">Chrome extension</text>
<text x="68.0" y="327.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">reads Odoo with my session</text>
<rect x="344.0" y="280.0" width="272.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#E6DDE3" stroke-width="1"/>
<text x="360.0" y="307.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">gh</text>
<text x="360.0" y="327.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">PRs, reviews, CI, every 10 min</text>
<rect x="636.0" y="280.0" width="272.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#E6DDE3" stroke-width="1"/>
<text x="652.0" y="307.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">GNOME calendar cache</text>
<text x="652.0" y="327.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">read-only, no Google keys</text>
<rect x="52.0" y="354.0" width="272.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#E6DDE3" stroke-width="1"/>
<text x="68.0" y="381.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">Claude Code hooks</text>
<text x="68.0" y="401.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">waiting for me, done, usage</text>
