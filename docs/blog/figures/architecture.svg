<text x="652.0" y="381.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">Microphone</text>
<text x="652.0" y="401.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">PipeWire: is something recording</text>
