<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">How the pieces talk</title><desc id="d">The laptop reads www.odoo.com through a Chrome extension, GitHub through gh, Google Calendar through GNOME&#x27;s calendar cache, plus Claude Code hooks, the screen lock and the microphone. The buddy-link service sends it all to the buddy over Wi-Fi, every packet sealed with AES-256-GCM, with USB as the fallback. The buddy fetches weather, its GitHub profile and the time itself.</desc><rect x="0.5" y="0.5" width="959" height="899" rx="14" fill="#FBF9FA" stroke="#E6DDE3"/><text x="40.0" y="54.0" font-size="27" font-weight="700" fill="#241A22" text-anchor="start">How the pieces talk</text>
<text x="40.0" y="84.0" font-size="16" font-weight="400" fill="#55464F" text-anchor="start">The laptop tells the buddy what it knows. The public bits, the buddy fetches itself.</text>
<text x="52.0" y="128.0" font-size="13" font-weight="600" fill="#017E84" text-anchor="start" letter-spacing="1.2">INTERNET, REACHED THROUGH THE LAPTOP</text>
<rect x="52.0" y="140.0" width="272.0" height="58.0" rx="10" fill="#E8F6F7" stroke="#BFE2E5" stroke-width="1"/>
<text x="68.0" y="165.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">www.odoo.com</text>
<text x="68.0" y="185.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">hours, tasks, meetings</text>
<rect x="344.0" y="140.0" width="272.0" height="58.0" rx="10" fill="#E8F6F7" stroke="#BFE2E5" stroke-width="1"/>
<text x="360.0" y="165.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">GitHub</text>
<text x="360.0" y="185.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">pull requests and checks</text>
<rect x="636.0" y="140.0" width="272.0" height="58.0" rx="10" fill="#E8F6F7" stroke="#BFE2E5" stroke-width="1"/>
<text x="652.0" y="165.0" font-size="16" font-weight="600" fill="#241A22" text-anchor="start">Google Calendar</text>
<text x="652.0" y="185.0" font-size="14" font-weight="400" fill="#55464F" text-anchor="start">synced to the laptop by GNOME</text>
<rect x="32.0" y="234.0" width="896.0" height="344.0" rx="16" fill="#F4EDF2" stroke="#E2D4DE" stroke-width="1"/>
<text x="52.0" y="560.0" font-size="13" font-weight="600" fill="#714B67" text-anchor="start" letter-spacing="1.2">LAPTOP · UBUNTU</text>
